<!DOCTYPE html>
<html>

<head>
<title>
  Flexbox Practice
</title>
<style>
  .menu {
  border: 1px solid #ccc;
  border-radius: 10px;
  width: 200px;
  padding: 15px;
  background: white;
  font-family: sans-serif;
}

.menu-item {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
}

.badge {
  background: #3b82f6;
  color: white;
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 14px;
}

</style>
</head>
<body>
<div class="menu">
  <div class="menu-item">
    <span>Home</span>
    <span class="badge">14</span>
  </div>
  <div class="menu-item">
    <span>Notifications</span>
    <span class="badge">3</span>
  </div>
  <div class="menu-item">
    <span>Messages</span>
    <span class="badge">5</span>
  </div>
</div>
</body>
</html>
