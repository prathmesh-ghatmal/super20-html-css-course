<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        .main{
            width:360px;
            height:60px;
            padding:10px 6px;
            box-shadow:  0 0 6px rgba(0, 0, 0, 0.3);

        }

        .profile{
            width:50px;
            height:50px;
            border-radius: 50%;
            object-fit: cover;
            display: inline-block;
            vertical-align:middle;
        }   
        .question{
            display: inline-block;
            vertical-align: middle;
            margin-left:10px;
            font-family: Arial;
            color:grey;
            font-size:18px;
            border: 0px;
        }
        .Tweet{
            display:inline-block;
            vertical-align: middle;
            color:white;
            background-color: rgb(0, 110, 255);
            border-width: 0px;
            width:60px;
            height:25px;
            border-radius: 18px;
            font-weight: bolder;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="main">
        <img class="profile" src="mercedes.jpg" alt="car">
        <input class="question" type="text" placeholder="What's happening?">
        <button class="Tweet">
            Tweet
        </button>
    </div>
    
</body>
</html>
