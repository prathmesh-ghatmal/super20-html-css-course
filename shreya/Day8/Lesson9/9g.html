    <style>
       div{
        display: inline-block;
        margin-left:5px;
       }
        .block{
            width: 180px;

            height:180px;
        }

        .name,.desc{
            font-family: Arial, Helvetica, sans-serif;

            margin-left: 6px;;

        }

        .name{
             font-weight: bolder
        }

        }

            background-color: rgb(26, 144, 255);
            border:none;
            width:90px;
            height:30px;
            border-radius:5px;
            margin-top: 10px;
            margin-left:6px;
            color:white;
        }

        
    </style>
</head>
